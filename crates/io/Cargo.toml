[package]
name = "iridium-cad-io"
description = "Cad file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iridium-cad-geom = { workspace = true }
iridium-cad-color = { workspace = true }
iridium-cad-doc = { workspace = true }
iridium-cad-dxf = { workspace = true }
iridium-cad-dwg = { workspace = true }
iridium-cad-render = { workspace = true }
iridium-cad-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
miniz_oxide = "0.9"
craft-pdf = { workspace = true, features = ["write"] }
quick-xml = { workspace = true }

[dev-dependencies]
# Reads Cad's DWG output as written (tests only; the same version as iridium-cad-dwg's).
acadrust = "0.6.6"
tiny-skia = { workspace = true }
# Reads plotted PDFs back.
craft-pdf = { workspace = true, features = ["read"] }
