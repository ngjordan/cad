[package]
name = "iridium-cad-render"
description = "Cad rendering: display lists (linetypes, hatches, text, blocks, dimensions) and a CPU rasteriser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iridium-cad-geom = { workspace = true }
iridium-cad-color = { workspace = true }
iridium-cad-doc = { workspace = true }
iridium-cad-fonts = { workspace = true }
tiny-skia = { workspace = true }
lyon_tessellation = { workspace = true }

# Display lists of large drawings are built on all cores (not on the web, which has no threads).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
